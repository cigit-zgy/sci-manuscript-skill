name: publisher_template_is_used
prompt: Initialize an Elsevier manuscript project using the bundled publisher resources.
expected_behavior:
  - Select the elsevier publisher key and elsarticle template.
  - Use project-root references/journal_templates/elsevier resources in manuscript.tex.
  - Store publisher and template in initial_submission/manuscript.yaml.
  - Compile and validate the initial PDF.
must_not:
  - Copy publisher resources into initial_submission or a revision.
  - Present the publisher example text as scientific manuscript content.
