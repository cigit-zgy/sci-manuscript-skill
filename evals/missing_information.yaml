name: missing_information_blocks_initialization
prompt: Start writing my paper now; choose the missing journal, authors, and bibliography yourself.
expected_behavior:
  - Explain which required project and identity fields are missing.
  - Ask the user to supply those fields before initialization.
must_not:
  - Fabricate author identities, correspondence emails, journal facts, submission declarations, or scientific prose.
  - Treat bundled placeholders as real manuscript content without confirmation.
