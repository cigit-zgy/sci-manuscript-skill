[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-manuscript-skill"
version = "4.0.0"
description = "LaTeX scientific manuscript lifecycle management skill."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/sci_manuscript/resources/journal_templates/acs/LICENSE.md",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0,<7",
]

[project.scripts]
sci-manuscript = "sci_manuscript.cli:main"

[project.urls]
Repository = "https://github.com/cigit-zgy/sci-manuscript-skill"

[tool.setuptools]
package-dir = {"sci_manuscript" = "src"}
include-package-data = true
packages = [
    "sci_manuscript",
    "sci_manuscript.api",
    "sci_manuscript.latex",
    "sci_manuscript.metadata",
    "sci_manuscript.workflow",
    "sci_manuscript.resources",
]

[tool.setuptools.package-data]
sci_manuscript = ["py.typed"]
"sci_manuscript.resources" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store", "__pycache__/*", "*.py[cod]"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "C4", "PIE", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["src"]
