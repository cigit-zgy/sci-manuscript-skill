[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-manuscript-skill"
version = "2.1.0"
description = "Isolated LaTeX scientific manuscript lifecycle management."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/resources/journal_templates/acs/LICENSE.md"]
dependencies = ["PyYAML>=6.0,<7", "ruamel.yaml>=0.18,<0.20"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
sci-manuscript = "sci_manuscript.cli:main"

[project.urls]
Repository = "https://github.com/cigit-zgy/sci-manuscript-skill"

[tool.setuptools]
packages = ["sci_manuscript"]
include-package-data = false

[tool.setuptools.package-dir]
sci_manuscript = "src"

[tool.setuptools.package-data]
sci_manuscript = ["py.typed", "resources/**/*"]

[tool.setuptools.exclude-package-data]
sci_manuscript = ["resources/**/__pycache__/*", "resources/**/*.pyc"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "C4", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/test_core.py" = ["RUF043"]
"tests/test_frontmatter_metadata.py" = ["RUF001"]
"tests/test_release_integration.py" = ["RUF001"]
"tests/test_review_audit.py" = ["RUF001"]
"tests/test_revision_style.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real LaTeX/latexdiff; selected probes may use Poppler",
]
