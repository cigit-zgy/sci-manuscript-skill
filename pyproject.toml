[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "wheel"]

[project]
dependencies = ["PyYAML>=6.0,<7"]
description = "LaTeX scientific manuscript lifecycle management skill."
license = "MIT"
name = "sci-manuscript-skill"
readme = "README.md"
requires-python = ">=3.11"
version = "4.1.0"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.11,<2", "pytest>=8,<10", "ruff>=0.9,<1", "types-PyYAML>=6.0,<7", "Pillow>=10,<12"]

[project.scripts]
sci-manuscript = "sci_manuscript.cli:main"

[tool.setuptools]
include-package-data = true
package-dir = {"sci_manuscript" = "src"}
packages = [
  "sci_manuscript",
  "sci_manuscript.api",
  "sci_manuscript.workflow",
  "sci_manuscript.domain",
  "sci_manuscript.latex",
  "sci_manuscript.infrastructure",
  "sci_manuscript.resources",
]

[tool.setuptools.package-data]
"sci_manuscript" = ["py.typed"]
"sci_manuscript.resources" = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]", ".DS_Store"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "C4", "PIE", "RUF"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
