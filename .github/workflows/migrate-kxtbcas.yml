name: Migrate KXTB-CAS resource

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-kxtbcas.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply migration
        run: |
          python scripts/migrate-kxtbcas-temp.py
          chmod +x src/resources/journal_templates/kxtbcas/scripts/setup-fonts.sh
      - name: Validate Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff check src tests
          mypy src
          pytest -q
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows/migrate-kxtbcas.yml'
          git commit -m "refactor: rename and isolate KXTB-CAS publisher resource"
          git push
