name: apply-review-scope-alignment

on:
  push:
    branches:
      - fix/reviewer-diff-semantics

permissions:
  contents: write

concurrency:
  group: apply-review-scope-alignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reviewer-diff-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply refactor
        run: python tools/align_review_scopes.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate source
        run: |
          ruff format .
          ruff check . --fix
          python -m compileall -q src tests
          pytest -q -m 'not integration'
          mypy src tests
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-review-scope-alignment.yml tools/align_review_scopes.py
          git add -A
          git commit -m 'Align reviewer scopes across adjacent revisions'
          git push origin HEAD:fix/reviewer-diff-semantics
