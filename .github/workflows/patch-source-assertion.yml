name: patch-source-assertion

on:
  push:
    branches:
      - fix/reviewer-diff-semantics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reviewer-diff-semantics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replace fragile source regex with rendered semantic gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_release_integration.py')
          text = path.read_text(encoding='utf-8')
          old = '''    green_spans = re.findall(r"\\\\DIFaddReview(?:FL)?\\{([^{}]*)\\}", marked_source)\n    red_spans = re.findall(r"\\\\DIFdel(?:FL)?\\{([^{}]*)\\}", marked_source)\n    assert any("新" in span for span in green_spans), green_spans\n    assert any("旧" in span for span in red_spans), red_spans\n    assert "第一句保持不变。" in marked_source\n    assert not any("第一句保持不变" in span for span in green_spans)\n'''
          new = '''    assert "第一句保持不变。" in marked_source\n    assert r"\\DIFaddReview{第一句保持不变。" not in marked_source\n'''
          if old not in text:
              raise SystemExit('target source-assertion block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_release_integration.py
          git commit -m 'Use rendered PDF for reviewer color regression [skip ci]'
          git push origin HEAD:fix/reviewer-diff-semantics
