name: apply-refinement-threshold

on:
  push:
    branches:
      - refactor/revision-provenance-map-v2
    paths:
      - .github/workflows/apply-refinement-threshold.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/revision-provenance-map-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply final similarity and size guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/sci_manuscript/diff.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'STYLE_END = "% SCI_DIFF_STYLE_END"\n',
              'STYLE_END = "% SCI_DIFF_STYLE_END"\n'
              'CHARACTER_REFINEMENT_THRESHOLD = 0.70\n'
              'MAX_CHARACTER_REFINEMENT_CHARS = 2000\n',
              1,
          )
          old = '''def _safe_character_refinement(old: str, new: str) -> bool:\n    """Restrict character-level refinement to prose, never TeX structure."""\n    unsafe = set(r"\\{}$%&#_^~")\n    return not any(char in unsafe for char in old + new)\n'''
          new = '''def _character_refinement_matcher(\n    old: str, new: str\n) -> SequenceMatcher[str] | None:\n    """Return a matcher only for bounded, structurally safe, similar prose."""\n    unsafe = set(r"\\{}$%&#_^~")\n    if any(char in unsafe for char in old + new):\n        return None\n    if max(len(old), len(new)) > MAX_CHARACTER_REFINEMENT_CHARS:\n        return None\n    matcher = SequenceMatcher(a=old, b=new, autojunk=False)\n    if matcher.ratio() < CHARACTER_REFINEMENT_THRESHOLD:\n        return None\n    return matcher\n\n\ndef _safe_character_refinement(old: str, new: str) -> bool:\n    """Return whether a replacement is eligible for character refinement."""\n    return _character_refinement_matcher(old, new) is not None\n'''
          if text.count(old) != 1:
              raise SystemExit('safe refinement function did not match exactly once')
          text = text.replace(old, new)
          old_refine = '''def _refine_replacement(\n    old: str,\n    new: str,\n    provenance: ProvenanceSource,\n    new_start: int,\n    *,\n    full_document: bool,\n) -> str:\n    matcher = SequenceMatcher(a=old, b=new, autojunk=False)\n'''
          new_refine = '''def _refine_replacement(\n    old: str,\n    new: str,\n    provenance: ProvenanceSource,\n    new_start: int,\n    matcher: SequenceMatcher[str],\n    *,\n    full_document: bool,\n) -> str:\n'''
          if text.count(old_refine) != 1:
              raise SystemExit('refine replacement signature did not match exactly once')
          text = text.replace(old_refine, new_refine)
          old_classify = '''            if _safe_character_refinement(segment.content, addition.content):\n                output.append(\n                    _refine_replacement(\n                        segment.content,\n                        addition.content,\n                        provenance,\n                        start,\n                        full_document=full_document,\n                    )\n                )\n            else:\n'''
          new_classify = '''            matcher = _character_refinement_matcher(\n                segment.content, addition.content\n            )\n            if matcher is not None:\n                output.append(\n                    _refine_replacement(\n                        segment.content,\n                        addition.content,\n                        provenance,\n                        start,\n                        matcher,\n                        full_document=full_document,\n                    )\n                )\n            else:\n'''
          if text.count(old_classify) != 1:
              raise SystemExit('classification block did not match exactly once')
          path.write_text(text.replace(old_classify, new_classify), encoding='utf-8')

          tests = Path('tests/test_provenance.py')
          test_text = tests.read_text(encoding='utf-8')
          test_text += r'''


def test_unrelated_replacement_is_not_fragmented_by_character_matches() -> None:
    provenance = extract_provenance(
        r"\begin{document}\review{1-1}{Reviewed wording.}\end{document}"
    )
    latexdiff = (
        r"\begin{document}"
        r"\DIFdel{Replace this placeholder and its }"
        r"\DIFadd{Reviewed wording.}"
        r"\end{document}"
    )
    classified = _classify_reviewer_additions(latexdiff, provenance)
    assert r"\DIFdel{Replace this placeholder and its }" in classified
    assert r"\DIFaddReview{Reviewed wording.}" in classified


def test_character_refinement_uses_seventy_percent_threshold_and_size_guard() -> None:
    from sci_manuscript.diff import _safe_character_refinement

    assert _safe_character_refinement("模型能够执行计算", "模型能够稳定执行计算")
    assert not _safe_character_refinement(
        "候选对象转化为规范结构化对象",
        "通过程序验证并经人工核查的候选对象进入正式结构化对象层",
    )
    assert not _safe_character_refinement("甲" * 2001, "甲" * 2000 + "乙")
'''
          tests.write_text(test_text, encoding='utf-8')
          PY
          python -m compileall -q src tests
          ruff format src/sci_manuscript/diff.py tests/test_provenance.py || true
          rm .github/workflows/apply-refinement-threshold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sci_manuscript/diff.py tests/test_provenance.py .github/workflows/apply-refinement-threshold.yml
          git commit -m 'Guard character refinement by similarity and size'
          git push origin HEAD:refactor/revision-provenance-map-v2
