name: apply-revision-semantics

on:
  push:
    branches:
      - fix/reviewer-diff-semantics
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-revision-semantics-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reviewer-diff-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply skill-level refactor
        run: python tools/apply_revision_semantics.py
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Normalize and validate source
        run: |
          ruff format .
          ruff check . --fix
          python -m compileall -q src tests
          pytest -q -m 'not integration'
          mypy src tests
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine reviewer-aware marked manuscript semantics'
          git push origin HEAD:fix/reviewer-diff-semantics
