name: test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: python -m compileall -q src tests
      - run: pytest -q -m "not integration"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests
      - run: python -m build
      - name: Wheel import and resource smoke test
        run: |
          python -m venv /tmp/sci-wheel-${{ matrix.python-version }}
          /tmp/sci-wheel-${{ matrix.python-version }}/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sci-wheel-${{ matrix.python-version }}/bin/python - <<'PY'
          from importlib.resources import files
          required = (
              "authors.yaml",
              "revision_style.template.tex",
              "manuscript_preamble/common.tex",
              "manuscript_preamble/en.tex",
              "manuscript_preamble/zh.tex",
              "revision/marked_runtime.tex",
              "revision/location_runtime.tex",
              "correspondence_templates/cover_letter/cover_letter_en.tex",
              "correspondence_templates/response/response_en.tex",
              "reviewer_comments/reviewer_comments_en.md",
              "reviewer_comments/reviewer_comments_zh.md",
              "journal_templates/chinese/kxtbcas.cls",
              "journal_templates/chinese/kxtbcas-numeric.bst",
              "journal_templates/elsevier/workflow.tex",
              "journal_templates/nature/workflow.tex",
              "journal_templates/acs/workflow.tex",
          )
          root = files("sci_manuscript") / "resources"
          assert all((root / path).is_file() for path in required)
          PY
          /tmp/sci-wheel-${{ matrix.python-version }}/bin/sci-manuscript --help
          /tmp/sci-wheel-${{ matrix.python-version }}/bin/sci-manuscript authors --help

  integration-release:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install real LaTeX and PDF toolchain
        run: |
          brew install tectonic latexdiff poppler
          brew install --cask font-fandol
      - run: python -m pip install ".[dev]"
      - name: Run unit and real integration release gates
        run: pytest -q
