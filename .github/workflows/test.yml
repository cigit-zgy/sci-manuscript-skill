name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-cjk-tokenizer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reviewer-diff-semantics
          fetch-depth: 0
      - name: Fix adjacent-character iteration once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/sci_manuscript/diff.py')
          text = path.read_text(encoding='utf-8')
          old = 'for previous, current in zip(text, text[1:], strict=True):'
          new = 'for previous, current in zip(text, text[1:]):'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sci_manuscript/diff.py
          if ! git diff --cached --quiet; then
            git commit -m 'Fix CJK adjacent-character tokenizer iteration'
            git push origin HEAD:fix/reviewer-diff-semantics
          fi

  quality:
    needs: patch-cjk-tokenizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: pytest -q -m "not integration"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests
      - run: python -m build
      - name: Wheel import and resource smoke test
        run: |
          python -m venv /tmp/sci-wheel
          /tmp/sci-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sci-wheel/bin/python -c "from sci_manuscript import ManuscriptProject; from importlib.resources import files; assert (files('sci_manuscript.resources') / 'revision_style.tex').is_file()"
          /tmp/sci-wheel/bin/sci-manuscript --help
          /tmp/sci-wheel/bin/sci-manuscript authors --help

  integration-release:
    needs: patch-cjk-tokenizer
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real LaTeX and PDF toolchain
        run: |
          brew install tectonic latexdiff poppler
          brew install --cask font-fandol
      - run: python -m pip install -e ".[dev]"
      - name: Run unit and real integration release gates
        run: pytest -q
