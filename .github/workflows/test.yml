name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests
      - run: pytest -q -m "not integration"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests
      - run: python -m build
      - name: Wheel import and resource smoke test
        run: |
          python -m venv /tmp/sci-wheel-${{ matrix.python-version }}
          /tmp/sci-wheel-${{ matrix.python-version }}/bin/pip install dist/*.whl
          cd /tmp
          /tmp/sci-wheel-${{ matrix.python-version }}/bin/python -c "from sci_manuscript import ManuscriptProject; from importlib.resources import files; assert (files('sci_manuscript.resources') / 'revision_style.template.tex').is_file()"
          /tmp/sci-wheel-${{ matrix.python-version }}/bin/sci-manuscript --help
          /tmp/sci-wheel-${{ matrix.python-version }}/bin/sci-manuscript authors --help

  integration-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real LaTeX and PDF toolchain
        run: |
          brew install tectonic latexdiff poppler
          brew install --cask font-fandol
      - run: python -m pip install -e ".[dev]"
      - name: Run unit and real integration release gates
        run: pytest -q
