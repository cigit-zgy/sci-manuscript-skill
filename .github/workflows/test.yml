name: Tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Check formatting
        run: ruff format --check .
      - name: Run Ruff
        run: ruff check .
      - name: Run Mypy
        run: mypy src scripts tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Audit wheel contents
        run: python scripts/verify_distribution.py dist/*.whl
      - name: Smoke-test installed wheel outside the checkout
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c "import sci_manuscript; print(sci_manuscript.__version__)"
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -c "from importlib.resources import files; assert files('sci_manuscript.resources').joinpath('revision_style.tex').is_file()"
          "${RUNNER_TEMP}/wheel-smoke/bin/sci-manuscript" --help
          "${RUNNER_TEMP}/wheel-smoke/bin/python" -m sci_manuscript --help
      - name: Smoke-test installed source distribution
        run: |
          python -m venv "${RUNNER_TEMP}/sdist-smoke"
          "${RUNNER_TEMP}/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/sdist-smoke/bin/python" -c "from sci_manuscript import ManuscriptProject, initialize_manuscript"
