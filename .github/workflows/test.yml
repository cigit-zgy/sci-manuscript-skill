name: Tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: >-
          python -m pip install
          "PyYAML>=6,<7"
          pytest
          ruff
          mypy
          types-PyYAML
      - name: Run tests
        run: pytest -q
      - name: Check formatting
        run: ruff format --check .
      - name: Run Ruff
        run: ruff check .
      - name: Run Mypy
        run: mypy scripts tests
