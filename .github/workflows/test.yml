name: test

on:
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reviewer-diff-semantics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Ruff fixes to the CJK diff implementation
        run: |
          python -m pip install ruff
          ruff check --fix src/sci_manuscript/diff.py
          ruff format src/sci_manuscript/diff.py
          python -m compileall -q src
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sci_manuscript/diff.py
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize CJK reviewer diff implementation'
            git push origin HEAD:fix/reviewer-diff-semantics
          fi
